<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>style.css 형성평가</title>
<style>
/* 레이아웃: 한 열 카드 흐름, 상단 학번·이름 카드, 하단 고정 제출 바 */
:root {
  --bg: #f3f6f6; --card: #ffffff; --text: #1a2426; --sub: #57666a; --line: #d6dfe0;
  --accent: #0f7b7a; --accent-soft: #e2f2f1; --on-accent: #ffffff;
  --ok: #1d8a4a; --ok-soft: #e4f5ea; --ng: #c93a3a; --ng-soft: #fbe9e9;
  --code-bg: #1d2628; --code-text: #e6efef; --code-key: #7fd6cf;
  --easy: #1d8a4a; --mid: #b77300; --hard: #c93a3a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121819; --card: #1b2325; --text: #e3eaeb; --sub: #9fb0b3; --line: #314043;
    --accent: #4cc6bf; --accent-soft: #1d3436; --on-accent: #0d1a1b;
    --ok: #4cc27c; --ok-soft: #1c3326; --ng: #ef6b6b; --ng-soft: #3a2222;
    --code-bg: #0c1112; --code-text: #e6efef; --code-key: #7fd6cf;
    --easy: #4cc27c; --mid: #e3a73a; --hard: #ef6b6b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121819; --card: #1b2325; --text: #e3eaeb; --sub: #9fb0b3; --line: #314043;
  --accent: #4cc6bf; --accent-soft: #1d3436; --on-accent: #0d1a1b;
  --ok: #4cc27c; --ok-soft: #1c3326; --ng: #ef6b6b; --ng-soft: #3a2222;
  --code-bg: #0c1112; --code-text: #e6efef; --code-key: #7fd6cf;
  --easy: #4cc27c; --mid: #e3a73a; --hard: #ef6b6b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  line-height: 1.6; font-size: 16px;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 120px; }
.top h1 { font-size: 22px; margin: 4px 0 2px; text-wrap: balance; }
.top h1 code { font-family: Consolas, "D2Coding", Menlo, monospace; color: var(--accent); }
.top p { margin: 0 0 16px; color: var(--sub); font-size: 14px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 18px 16px; margin-bottom: 16px;
}
/* 학번·이름 */
.idcard h2 { font-size: 16px; margin: 0 0 10px; }
.idrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.idrow label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 600; min-width: 0; }
.idrow input {
  font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 8px;
  border: 1.5px solid var(--line); background: var(--bg); color: var(--text); width: 100%;
}
.idrow input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.idrow input.need { border-color: var(--ng); }
.idrow input:disabled { opacity: .75; }
.idnote { font-size: 13px; color: var(--sub); margin: 8px 0 0; }
@media (max-width: 420px) { .idrow { grid-template-columns: 1fr; } }
/* 문항 */
.qhead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.qno { font-weight: 700; font-size: 15px; }
.badge { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
.badge.쉬움 { color: var(--easy); } .badge.보통 { color: var(--mid); } .badge.어려움 { color: var(--hard); }
.qtext { margin: 0 0 12px; font-weight: 600; }
pre {
  background: var(--code-bg); color: var(--code-text); border-radius: 8px;
  padding: 12px 14px; margin: 0 0 14px; overflow-x: auto;
  font-family: Consolas, "D2Coding", Menlo, monospace; font-size: 13.5px; line-height: 1.55;
}
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { position: absolute; left: -9999px; }
.opt {
  display: flex; gap: 10px; align-items: flex-start;
  border: 1.5px solid var(--line); border-radius: 8px;
  padding: 11px 12px; margin-bottom: 8px; cursor: pointer; min-height: 46px;
}
.opt input { margin: 4px 0 0; width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--accent); }
.opt .num { font-weight: 700; flex-shrink: 0; }
.opt .txt { word-break: break-all; min-width: 0; white-space: pre-wrap; }
.opt .txt.code { font-family: Consolas, "D2Coding", Menlo, monospace; font-size: 14px; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--ng); background: var(--ng-soft); }
.locked .opt { cursor: default; }
.mark { font-size: 13px; font-weight: 700; margin-left: auto; flex-shrink: 0; padding-left: 6px; }
.correct .mark { color: var(--ok); } .wrong .mark { color: var(--ng); }
.fb { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 12px; font-size: 15px; }
.verdict { font-weight: 700; margin-bottom: 6px; }
.verdict.ok { color: var(--ok); } .verdict.ng { color: var(--ng); }
.fb h4 { margin: 10px 0 4px; font-size: 14px; color: var(--sub); }
.fb p { margin: 0; }
.fb ul { margin: 4px 0 0; padding-left: 18px; }
.fb li { margin-bottom: 6px; }
.fb li.mine { font-weight: 600; }
.tag-mine { font-size: 12px; color: var(--ng); font-weight: 700; }
/* 결과 */
.result { border: 2px solid var(--accent); }
.result .rtitle { font-size: 13px; letter-spacing: .04em; color: var(--sub); margin: 0 0 6px; text-align: center; }
.who { text-align: center; font-size: 20px; font-weight: 800; margin: 0; word-break: break-all; }
.who span { color: var(--accent); }
.score { text-align: center; font-size: 48px; font-weight: 800; color: var(--accent); margin: 2px 0 0; font-variant-numeric: tabular-nums; }
.rdetail { text-align: center; color: var(--sub); margin: 0 0 10px; font-size: 14px; font-variant-numeric: tabular-nums; }
.lv { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; font-size: 14px; margin-bottom: 12px; font-variant-numeric: tabular-nums; }
.ox { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin: 0 0 12px; }
.ox div {
  border-radius: 6px; text-align: center; font-size: 12px; padding: 3px 0; line-height: 1.3;
  font-variant-numeric: tabular-nums; border: 1px solid var(--line);
}
.ox div b { display: block; font-size: 14px; }
.ox .o { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.ox .x { background: var(--ng-soft); color: var(--ng); border-color: var(--ng); }
.meta { text-align: center; font-size: 13px; color: var(--sub); margin: 0 0 12px; font-variant-numeric: tabular-nums; }
.center { text-align: center; }
.btn {
  appearance: none; border: 0; border-radius: 8px; padding: 13px 22px;
  font-size: 16px; font-weight: 700; cursor: pointer; background: var(--accent); color: var(--on-accent);
}
.btn:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--card);
  border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
}
.bar .in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.bar .prog { flex: 1; font-size: 14px; color: var(--sub); min-width: 0; }
.bar .prog b { color: var(--text); }
.warn { color: var(--ng); font-size: 13px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="wrap">
  <a href="../" style="display:inline-block;margin:0 0 8px;font-size:14px;font-weight:600;color:var(--accent);text-decoration:none">← 수업 자료 목록</a>
  <header class="top">
    <h1><code>style.css</code> 형성평가</h1>
    <p>응용프로그래밍 화면구현 · CSS 4지선다 20문항 (쉬움 10 · 보통 8 · 어려움 2)</p>
  </header>

  <section class="card result" id="result" hidden aria-live="polite">
    <p class="rtitle">형성평가 결과</p>
    <p class="who"><span id="rId"></span> <span id="rName"></span></p>
    <div class="score" id="score"></div>
    <p class="rdetail" id="detail"></p>
    <div class="lv" id="lvDetail"></div>
    <div class="ox" id="ox"></div>
    <p class="meta" id="meta"></p>
    <div class="center"><button class="btn" type="button" id="retryTop">다시 풀기</button></div>
  </section>

  <section class="card idcard" id="idcard">
    <h2>학번과 이름을 입력하세요</h2>
    <div class="idrow">
      <label for="sid">학번
        <input type="text" id="sid" inputmode="numeric" autocomplete="off" placeholder="예: 10315" maxlength="10">
      </label>
      <label for="sname">이름
        <input type="text" id="sname" autocomplete="off" placeholder="예: 홍길동" maxlength="20">
      </label>
    </div>
    <p class="idnote">제출하면 결과 화면에 학번과 이름이 함께 표시됩니다. 결과 화면을 캡처해서 제출하세요.</p>
  </section>

  <div id="quiz"></div>

  <div class="center" id="bottomRetry" hidden>
    <button class="btn" type="button" id="retryBottom">다시 풀기</button>
  </div>
</div>

<div class="bar" id="bar">
  <div class="in">
    <div class="prog">
      <div>푼 문항 <b id="cnt">0</b> / 20</div>
      <div class="warn" id="warn" hidden></div>
    </div>
    <button class="btn" type="button" id="submitBtn">제출하기</button>
  </div>
</div>

<script>
var QUESTIONS = [
  /* ───────── 쉬움 10 ───────── */
  {
    lv: "쉬움",
    q: "header의 배경색을 파란색으로 지정하는 CSS 코드로 올바른 것은?",
    codeOpts: true,
    opts: [
      "header { background-color: blue; }",
      "header ( background-color: blue; )",
      "header { background-color = blue; }",
      "<header> { background-color: blue; }"
    ],
    ans: 0,
    basis: "CSS는 「선택자 { 속성: 값; }」 모양으로 쓴다. 중괄호 { }로 감싸고, 속성과 값 사이에는 콜론(:), 끝에는 세미콜론(;)을 쓴다.",
    why: [
      null,
      "CSS는 소괄호 ( )가 아니라 중괄호 { }로 감싼다.",
      "속성과 값 사이에는 등호(=)가 아니라 콜론(:)을 쓴다.",
      "CSS 파일에서는 꺾쇠 < >를 쓰지 않는다. 선택자는 태그 이름 header만 적는다."
    ]
  },
  {
    lv: "쉬움",
    q: "header.jsp에서 디자인 파일 style.css를 연결하는 코드로 올바른 것은? (실제 파일 이름은 style.css이다.)",
    codeOpts: true,
    opts: [
      '<link href="style.css">',
      '<link href="style.css" rel="stylesheet">',
      '<a href="style.css" rel="stylesheet">',
      '<link href="Style.css" rel="stylesheet">'
    ],
    ans: 1,
    basis: 'CSS 파일은 link 태그로 연결한다. href에는 파일 이름을, rel="stylesheet"에는 "이 파일은 디자인 파일이다"라는 뜻을 적는다.',
    why: [
      'rel="stylesheet"가 빠졌다. 그러면 브라우저가 이 파일을 디자인 파일로 알지 못해 CSS가 적용되지 않는다.',
      null,
      "a 태그는 클릭해서 다른 페이지로 이동하는 태그이다. CSS 파일 연결은 link 태그로 한다.",
      "파일 이름은 대문자·소문자까지 똑같아야 한다. 실제 파일은 style.css인데 Style.css로 쓰면 파일을 찾지 못한다."
    ]
  },
  {
    lv: "쉬움",
    q: "footer의 글자색을 흰색으로 바꾸려고 한다. ????? 에 들어갈 속성은?",
    code: "footer {\n    ?????: white;\n}",
    codeOpts: true,
    opts: ["background-color", "font-color", "color", "text-color"],
    ans: 2,
    basis: "글자색은 color 속성으로 지정한다.",
    why: [
      "background-color는 글자 뒤의 배경색을 바꾼다. 글자색이 아니다.",
      "font-color라는 CSS 속성은 없다. 글자색은 color로 쓴다.",
      null,
      "text-color라는 CSS 속성은 없다. 글자색은 color로 쓴다."
    ]
  },
  {
    lv: "쉬움",
    q: "아래 코드는 section에 어떤 디자인을 적용하는가?",
    code: "section {\n    background-color: lightgray;\n}",
    codeOpts: false,
    opts: [
      "section의 글자색을 연한 회색으로 바꾼다.",
      "section의 테두리를 연한 회색으로 바꾼다.",
      "section 안의 링크 색만 연한 회색으로 바꾼다.",
      "section의 배경색을 연한 회색으로 바꾼다."
    ],
    ans: 3,
    basis: "background-color는 배경색을 지정한다. lightgray는 연한 회색이다.",
    why: [
      "글자색은 color 속성이 바꾼다. background-color는 배경색이다.",
      "background-color는 테두리가 아니라 상자 안쪽 배경 전체를 칠한다.",
      "선택자가 section이므로 section 영역 전체의 배경색이 바뀐다. 링크 색만 바뀌는 것이 아니다.",
      null
    ]
  },
  {
    lv: "쉬움",
    q: "header에 text-align: center; 를 지정하면 어떻게 되는가?",
    code: "header {\n    text-align: center;\n}",
    codeOpts: false,
    opts: [
      "header 안의 글자가 가로 방향 가운데로 정렬된다.",
      "header 안의 글자가 세로 방향 가운데로 정렬된다.",
      "header 상자 자체가 화면 정가운데로 이동한다.",
      "header 안의 글자 크기가 커진다."
    ],
    ans: 0,
    basis: "text-align은 글자를 가로 방향으로 정렬한다. center는 가운데, left는 왼쪽, right는 오른쪽이다.",
    why: [
      null,
      "text-align은 가로 정렬만 한다. 세로 가운데는 line-height를 height와 같게 하여 맞춘다.",
      "text-align은 상자 안의 글자를 정렬할 뿐, header 상자를 옮기지 않는다.",
      "글자 크기는 font-size로 바꾼다."
    ]
  },
  {
    lv: "쉬움",
    q: "header의 제목 글자 크기를 30px로 지정하는 코드는?",
    codeOpts: true,
    opts: [
      "header { line-height: 30px; }",
      "header { font-size: 30px; }",
      "header { height: 30px; }",
      "header { font: 30; }"
    ],
    ans: 1,
    basis: "font-size는 글자 크기를 지정하는 속성이다. 값에는 단위 px를 붙인다.",
    why: [
      "line-height는 줄 높이이다. 글자 크기는 그대로이고 줄의 높이만 바뀐다.",
      null,
      "height는 header 상자의 높이이다. 글자 크기와 다르다.",
      "글자 크기 속성 이름은 font-size이고, 값에는 px 같은 단위를 붙여야 한다."
    ]
  },
  {
    lv: "쉬움",
    q: "메뉴(a 태그)의 밑줄을 없애는 코드로 올바른 것은?",
    codeOpts: true,
    opts: [
      "a { text-align: none; }",
      "a { text-decoration: underline; }",
      "a { color: none; }",
      "a { text-decoration: none; }"
    ],
    ans: 3,
    basis: "text-decoration은 밑줄 같은 글자 장식을 정한다. none은 '장식 없음'이라는 뜻이라 링크 밑줄이 사라진다.",
    why: [
      "text-align은 글자 정렬 속성이다. 밑줄과 관계없다.",
      "underline은 밑줄을 긋는다는 뜻이다. 밑줄이 그대로 남는다.",
      "color는 글자색 속성이다. 밑줄을 없애지 못한다.",
      null
    ]
  },
  {
    lv: "쉬움",
    q: "CSS 파일에서 class 선택자를 만들 때 이름 앞에 붙이는 기호는?",

    opts: ["# (샵)", "- (빼기)", ". (점)", "* (별표)"],

    basis: "class 선택자는 CSS에서 이름 앞에 점(.)을 붙인다. HTML에서는 점 없이 class=\"td-right\"로 쓴다.",

    opts: ["margin", "padding", "line-height", "width"],

    basis: "margin은 바깥 여백이다. 상자 바깥에 빈 공간을 만들어 다른 요소와 떨어뜨린다.",
    why: [

      "padding은 안쪽 여백이다. 상자 테두리와 안쪽 글자 사이를 넓힌다.",

    opts: ["margin", "height", "padding", "text-align"],

      "height는 칸의 높이를 정할 뿐, 왼쪽·오른쪽 여백은 생기지 않는다.",
      null,
      "text-align은 글자의 가로 정렬이다. 여백을 만들지 않는다."
    ]
  },

  /* ───────── 보통 8 ───────── */

    lv: "보통",

    opts: [
      "footer { position: fixed; top: 0; }",
      "footer { bottom: 0; }",
      "footer { position: fixed; bottom: 0; }",
      "footer { text-align: bottom; }"

var NUMS = ["①", "②", "③", "④"];
var order = [];   // 화면 순서 → 원래 문항 번호
var perms = [];   // 문항별 보기 순서 (화면 위치 → 원래 보기 번호)
var submitted = false;
var attempt = 0;

function $(id) { return document.getElementById(id); }
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function pad(n) { return (n < 10 ? "0" : "") + n; }
function scrollTop() {
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
}

function render() {
  submitted = false;
  attempt++;
  order = shuffle(QUESTIONS.map(function (_, i) { return i; }));
  perms = [];
  var box = $("quiz");
  box.innerHTML = "";

  order.forEach(function (qi, pos) {
    var Q = QUESTIONS[qi];
    var perm = shuffle([0, 1, 2, 3]);
    perms.push(perm);

    var card = el("article", "card");
    card.id = "card" + pos;
    var head = el("div", "qhead");
    head.appendChild(el("span", "qno", "문항 " + (pos + 1)));
    head.appendChild(el("span", "badge " + Q.lv, Q.lv));
    card.appendChild(head);
    card.appendChild(el("p", "qtext", Q.q));
    if (Q.code) {
      var pre = el("pre");
      pre.appendChild(el("code", null, Q.code));
      card.appendChild(pre);
    }

    var fs = el("fieldset");
    fs.appendChild(el("legend", null, "문항 " + (pos + 1) + " 보기"));
    perm.forEach(function (oi, disp) {
      var lab = el("label", "opt");
      lab.dataset.oi = oi;
      var inp = document.createElement("input");
      inp.type = "radio"; inp.name = "q" + pos; inp.value = oi;
      inp.id = "q" + pos + "o" + disp;
      inp.addEventListener("change", updateCount);
      lab.appendChild(inp);
      lab.appendChild(el("span", "num", NUMS[disp]));
      lab.appendChild(el("span", "txt" + (Q.codeOpts ? " code" : ""), Q.opts[oi]));
      lab.appendChild(el("span", "mark", ""));
      fs.appendChild(lab);
    });
    card.appendChild(fs);
    var fb = el("div", "fb");
    fb.hidden = true;
    card.appendChild(fb);
    box.appendChild(card);
  });

  $("result").hidden = true;
  $("bottomRetry").hidden = true;
  $("bar").hidden = false;
  $("warn").hidden = true;
  $("sid").disabled = false;
  $("sname").disabled = false;
  updateCount();
}

function chosen(pos) {
  var c = document.querySelector('input[name="q' + pos + '"]:checked');
  return c ? Number(c.value) : null;
}

function updateCount() {
  var n = 0;
  for (var p = 0; p < order.length; p++) if (chosen(p) !== null) n++;
  $("cnt").textContent = n;
  if (n === order.length && $("sid").value.trim() && $("sname").value.trim()) $("warn").hidden = true;
}

function showWarn(msg) {
  var w = $("warn");
  w.textContent = msg;
  w.hidden = false;
}

function grade() {
  if (submitted) return;
  var sid = $("sid").value.trim();
  var sname = $("sname").value.trim();
  $("sid").classList.toggle("need", !sid);
  $("sname").classList.toggle("need", !sname);
  if (!sid || !sname) {
    showWarn("학번과 이름을 먼저 입력하세요.");
    $("idcard").scrollIntoView({ block: "start" });
    (!sid ? $("sid") : $("sname")).focus();
    return;
  }
  var missing = [];
  for (var p = 0; p < order.length; p++) if (chosen(p) === null) missing.push(p + 1);
  if (missing.length) {
    showWarn("아직 풀지 않은 문항: " + missing.join(", ") + "번");
    $("card" + (missing[0] - 1)).scrollIntoView({ block: "start" });
    return;
  }

  submitted = true;
  var correct = 0;
  var lvStat = { "쉬움": [0, 0], "보통": [0, 0], "어려움": [0, 0] };
  var ox = $("ox");
  ox.innerHTML = "";

  order.forEach(function (qi, pos) {
    var Q = QUESTIONS[qi];
    var perm = perms[pos];
    var pick = chosen(pos);
    var ok = pick === Q.ans;
    if (ok) correct++;
    lvStat[Q.lv][1]++;
    if (ok) lvStat[Q.lv][0]++;

    var cell = el("div", ok ? "o" : "x");
    cell.appendChild(document.createTextNode(String(pos + 1)));
    cell.appendChild(el("b", null, ok ? "O" : "X"));
    ox.appendChild(cell);

    var card = $("card" + pos);
    card.classList.add("locked");
    card.querySelectorAll("input").forEach(function (i) { i.disabled = true; });
    card.querySelectorAll(".opt").forEach(function (lab) {
      var oi = Number(lab.dataset.oi);
      var mark = lab.querySelector(".mark");
      if (oi === Q.ans) { lab.classList.add("correct"); mark.textContent = "정답"; }
      else if (oi === pick) { lab.classList.add("wrong"); mark.textContent = "내 답"; }
    });

    var ansDisp = perm.indexOf(Q.ans);
    var fb = card.querySelector(".fb");
    fb.innerHTML = "";
    fb.appendChild(el("div", "verdict " + (ok ? "ok" : "ng"),
      ok ? "정답입니다." : "오답입니다. 정답은 " + NUMS[ansDisp] + "번입니다."));
    fb.appendChild(el("h4", null, "정답 근거"));
    fb.appendChild(el("p", null, Q.basis));
    fb.appendChild(el("h4", null, "오답 해설"));
    var ul = el("ul");
    perm.forEach(function (oi, disp) {
      var w = Q.why[oi];
      if (w === null) return;
      var li = el("li", oi === pick ? "mine" : "");
      li.appendChild(document.createTextNode(NUMS[disp] + " " + w));
      if (oi === pick) {
        li.appendChild(document.createTextNode(" "));
        li.appendChild(el("span", "tag-mine", "← 내가 고른 답"));
      }
      ul.appendChild(li);
    });
    fb.appendChild(ul);
    fb.hidden = false;
  });

  var now = new Date();
  $("rId").textContent = sid;
  $("rName").textContent = sname;
  $("score").textContent = (correct * 5) + "점";
  $("detail").textContent = "20문항 중 " + correct + "문항 정답 (문항당 5점)";
  var lv = $("lvDetail");
  lv.innerHTML = "";
  ["쉬움", "보통", "어려움"].forEach(function (k) {
    lv.appendChild(el("span", null, k + " " + lvStat[k][0] + "/" + lvStat[k][1]));
  });
  $("meta").textContent = "제출 " + now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) +
    " " + pad(now.getHours()) + ":" + pad(now.getMinutes()) + " · " + attempt + "번째 응시";

  $("sid").disabled = true;
  $("sname").disabled = true;
  $("result").hidden = false;
  $("bottomRetry").hidden = false;
  $("bar").hidden = true;
  scrollTop();
}

function retry() {
  render();
  scrollTop();
}

$("submitBtn").addEventListener("click", grade);
$("retryTop").addEventListener("click", retry);
$("retryBottom").addEventListener("click", retry);
$("sid").addEventListener("input", function () { this.classList.remove("need"); updateCount(); });
$("sname").addEventListener("input", function () { this.classList.remove("need"); updateCount(); });

render();
</script>
</body>
