<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>개발환경 구축하기 최종 점검</title>
<style>
/* 레이아웃: 한 열 흐름 — 학번·이름 → 결과(채점 후) → 영역별 문항 카드, 하단 고정 채점 바 */
:root {
  --bg: #f3f5f8; --card: #ffffff; --text: #1b2230; --sub: #5a6474; --line: #d7dce5;
  --accent: #2d5bb9; --accent-soft: #e6edfa; --on-accent: #ffffff;
  --ok: #1d8a4a; --ok-soft: #e4f5ea; --ng: #c93a3a; --ng-soft: #fbe9e9; --note: #7a5a00; --note-soft: #fdf4dc;
  --code-bg: #1e2430; --code-text: #e7ecf4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --card: #1b212b; --text: #e4e8ef; --sub: #a2abba; --line: #323a48;
    --accent: #7ea2ef; --accent-soft: #222d43; --on-accent: #0f1522;
    --ok: #4cc27c; --ok-soft: #1c3326; --ng: #ef6b6b; --ng-soft: #3a2222; --note: #e8c25a; --note-soft: #362e18;
    --code-bg: #0d1117; --code-text: #e7ecf4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --card: #1b212b; --text: #e4e8ef; --sub: #a2abba; --line: #323a48;
  --accent: #7ea2ef; --accent-soft: #222d43; --on-accent: #0f1522;
  --ok: #4cc27c; --ok-soft: #1c3326; --ng: #ef6b6b; --ng-soft: #3a2222; --note: #e8c25a; --note-soft: #362e18;
  --code-bg: #0d1117; --code-text: #e7ecf4;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  line-height: 1.6; font-size: 16px; word-break: keep-all; overflow-wrap: anywhere;
}
code, pre, .mono { font-family: Consolas, "D2Coding", Menlo, monospace; }
.wrap { max-width: 780px; margin: 0 auto; padding: 20px 16px 120px; }
.top h1 { font-size: 22px; margin: 4px 0 2px; text-wrap: balance; }
.top p { margin: 0 0 16px; color: var(--sub); font-size: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.card h2 { font-size: 16px; margin: 0 0 8px; }
.idrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.idrow label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 600; min-width: 0; }
.idrow input { font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); color: var(--text); width: 100%; }
.idrow input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.idrow input.need { border-color: var(--ng); }
@media (max-width: 420px) { .idrow { grid-template-columns: 1fr; } }
.note { font-size: 13px; color: var(--sub); margin: 8px 0 0; }
.sec { font-size: 15px; font-weight: 800; color: var(--accent); margin: 22px 0 8px; }
.bogi { border: 1.5px solid var(--text); border-radius: 8px; padding: 8px 12px; margin: 0 0 12px; background: var(--card); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.bogi b { margin-right: 4px; }
.bogi span { font-family: Consolas, "D2Coding", Menlo, monospace; font-weight: 700; padding: 2px 10px; border-radius: 6px; background: var(--accent-soft); }
.q .qh { display: flex; gap: 8px; align-items: baseline; margin-bottom: 8px; }
.q .no { font-weight: 800; color: var(--accent); flex-shrink: 0; font-variant-numeric: tabular-nums; }
.q .qt { font-weight: 600; min-width: 0; flex: 1; }
.q .mark { font-weight: 800; flex-shrink: 0; font-size: 15px; }
.q.ok { border-color: var(--ok); } .q.ok .mark { color: var(--ok); }
.q.ng { border-color: var(--ng); } .q.ng .mark { color: var(--ng); }
pre.ctx { background: var(--code-bg); color: var(--code-text); border-radius: 8px; padding: 8px 12px; margin: 0 0 8px; overflow-x: auto; font-size: 14px; }
.ansrow { display: flex; align-items: stretch; border: 1.5px solid var(--text); border-radius: 6px; overflow: hidden; }
.anslab { flex-shrink: 0; padding: 8px 12px; font-weight: 700; background: var(--accent-soft); border-right: 1.5px solid var(--text); }
.ansin { flex: 1; min-width: 0; border: 0; padding: 8px 12px; font: inherit; font-size: 16px; background: var(--card); color: var(--text); }
.ansin:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
.ansin:disabled { opacity: .8; }
.explain { margin-top: 8px; border-radius: 8px; padding: 8px 12px; font-size: 14px; background: var(--ng-soft); }
.explain b { color: var(--ng); }
.explain.tip { background: var(--note-soft); }
.explain.tip b { color: var(--note); }
/* 결과 */
.result { border: 2px solid var(--accent); text-align: center; }
.result.perfect { border-color: var(--ok); }
.rtitle { font-size: 13px; letter-spacing: .04em; color: var(--sub); margin: 0 0 6px; }
.who { font-size: 20px; font-weight: 800; margin: 0; }
.who span { color: var(--accent); }
.score { font-size: 48px; font-weight: 800; color: var(--accent); margin: 2px 0 0; font-variant-numeric: tabular-nums; }
.perfect .score { color: var(--ok); }
.stamp { display: inline-block; margin: 4px 0 8px; padding: 5px 16px; border-radius: 999px; border: 2px solid var(--ok); color: var(--ok); background: var(--ok-soft); font-weight: 800; }
.rdetail { color: var(--sub); margin: 0 0 10px; font-size: 14px; font-variant-numeric: tabular-nums; }
.retry { color: var(--ng); font-weight: 700; margin: 0 0 10px; }
.grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin: 0 0 12px; }
.grid div { border-radius: 6px; font-size: 11px; padding: 3px 0; line-height: 1.3; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.grid div b { display: block; font-size: 13px; }
.grid .o { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.grid .x { background: var(--ng-soft); color: var(--ng); border-color: var(--ng); }
@media (max-width: 420px) { .grid { grid-template-columns: repeat(5, 1fr); } }
.meta { font-size: 13px; color: var(--sub); margin: 0; font-variant-numeric: tabular-nums; }
.btn { appearance: none; border: 0; border-radius: 8px; padding: 13px 22px; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; background: var(--accent); color: var(--on-accent); }
.btn:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.bar .in { max-width: 780px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.bar .prog { flex: 1; font-size: 14px; color: var(--sub); min-width: 0; font-variant-numeric: tabular-nums; }
.bar .prog b { color: var(--text); }
.warn { color: var(--ng); font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ng); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 40; max-width: calc(100% - 32px); }
.dup { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; }
.dup .box { max-width: 460px; background: var(--card); border: 2px solid var(--ng); border-radius: 12px; padding: 22px 20px; text-align: center; }
.dup h2 { margin: 0 0 8px; font-size: 19px; color: var(--ng); }
.dup p { margin: 0; }
.figure { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 0 0 12px; text-align: center; }
.figure img { max-width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--line); }
.figure p { margin: 6px 0 0; font-size: 13px; color: var(--sub); text-align: left; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>개발환경 구축하기 최종 점검</h1>
    <p>응용프로그래밍 화면구현 · 수행평가 대비 형성평가 20문제 · 답을 단어로 쓰고 [채점하기]를 누르세요. 틀린 문제는 설명을 읽고 고쳐서 100점을 만드세요.</p>
  </header>

  <section class="card" id="idcard">
    <h2>학번과 이름을 입력하세요</h2>
    <div class="idrow">
      <label for="sid">학번<input type="text" id="sid" inputmode="numeric" autocomplete="off" placeholder="예: 10315" maxlength="10"></label>
      <label for="sname">이름<input type="text" id="sname" autocomplete="off" placeholder="예: 홍길동" maxlength="20"></label>
    </div>
    <p class="note">대문자·소문자는 구분하지 않습니다. 100점이 되면 결과 화면을 캡처해서 제출하세요.</p>
  </section>

  <section class="card result" id="res" hidden aria-live="polite"></section>
  <div id="list"></div>
</div>

<div class="bar" id="bar">
  <div class="in">
    <div class="prog">
      <div>정답 <b id="okCnt">0</b> / 20 · 채점 <b id="tries">0</b>회</div>
      <div class="warn" id="warn" hidden></div>
    </div>
    <button class="btn" type="button" id="gradeBtn">채점하기</button>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<div class="dup" id="dup" role="alertdialog" aria-labelledby="dupTitle" hidden>
  <div class="box">
    <h2 id="dupTitle">다른 창에서도 열려 있습니다</h2>
    <p>이 페이지는 한 번에 한 창에서만 풀 수 있습니다. 다른 창(탭)을 모두 닫고 이 페이지를 새로고침하세요.</p>
  </div>
</div>

<script>
function $(id) { return document.getElementById(id); }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function pad2(n) { return (n < 10 ? "0" : "") + n; }
function stamp(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }

/* ───── 답 비교: 대소문자·앞뒤 공백 무시 ───── */
function norm(v) { return v.trim().toLowerCase().replace(/\s+/g, " "); }
function keyCombo(v) {          // "윈도우 + e", "Win+E", "Windows키+E" 모두 같은 답으로 본다
  v = v.toLowerCase().replace(/\s+/g, "");
  v = v.replace(/윈도우키|윈도우|windows키|windowskey|windows|window|win키|win|⊞|❖/g, "win");
  v = v.replace(/쉬프트|시프트|shift키/g, "shift");
  if (v.indexOf("+") < 0) return null;
  return v.split("+").filter(Boolean).sort().join("+");
}
function oneOf(list) { return function (v) { return list.indexOf(norm(v)) >= 0; }; }
function combo(want) { var w = want.split("+").sort().join("+"); var f = function (v) { return keyCombo(v) === w; }; f.isCombo = true; return f; }

  { q: "Eclipse의 Oracle 연결 설정에서, 학교 실습에서 Catalog(객체 목록을 탐색할 범위)에 입력한 값을 쓰시오.", ok: oneOf(["dba"]),
    ex: "Catalog는 데이터 객체를 탐색할 범위입니다. 학교 실습에서는 데이터베이스 관리자(Database Administrator)의 줄임말 세 글자를 씁니다." },
  { q: "Java 프로그램과 Oracle 데이터베이스 사이에서 「통역사」처럼 연결을 돕는 것을 무엇 드라이버라고 하는가? (영문 4글자)", ok: oneOf(["jdbc"]),
    ex: "Java DataBase Connectivity의 줄임말입니다. ojdbc6.jar 파일 이름 안에도 이 네 글자가 들어 있습니다." },
  { q: "header.jsp에서 외부 CSS 파일(style.css)을 연결할 때 사용하는 태그의 이름을 쓰시오. (꺾쇠 없이)", ctx: "<____ href=\"style.css\" rel=\"stylesheet\">",
    ok: oneOf(["link"]),
    ex: "외부 파일을 「연결」한다는 뜻의 영어 단어입니다. href에는 파일 이름, rel=\"stylesheet\"는 스타일시트라는 뜻입니다.",
    tips: { "style": "style 태그는 CSS를 페이지 안에 직접 쓸 때 사용합니다. 외부 파일을 연결하는 태그와 헷갈리지 마세요.", "<link>": "꺾쇠(< >) 없이 태그 이름만 쓰세요." } }
];

/* 문제 순서: 6 Service Name · 7 Host · 8 Port · 9 User name · 10 Password · 11 Catalog, 이후 한 칸씩 밀림 */
QS = [0, 1, 2, 3, 4, 5, 6, 9, 7, 8, 17, 10, 11, 12, 13, 14, 15, 16, 18, 19].map(function (k) { return QS[k]; });

/* ───── 화면 ───── */
var S = { tries: 0, first: null, solved: {}, done: false };
function build() {
  var list = $("list");
  list.innerHTML = "";
  QS.forEach(function (Q, i) {
    SECTIONS.forEach(function (sec) {
      if (sec.start === i) {
        list.appendChild(el("div", "sec", sec.title));
        if (sec.bogi) {
          var b = el("div", "bogi");
          b.appendChild(el("b", null, "공통 보기"));
          sec.bogi.forEach(function (w) { b.appendChild(el("span", null, w)); });
          list.appendChild(b);
        }
      }
    });
    if (i === 5) {                       // 6~11번이 묻는 Oracle 연결 화면
      var fig = el("figure", "figure");
      var img = document.createElement("img");
      img.src = CONN_IMG; img.width = 511; img.height = 602;
      img.alt = "Eclipse New Connection Profile 화면. Service Name, Host, Port number, User name, Password, Catalog 칸이 가려져 있고 각각 문제 번호가 표시되어 있다.";
      fig.appendChild(img);
      fig.appendChild(el("p", null, "Eclipse의 New Connection Profile 화면입니다. 빨간 번호는 그 칸에 들어갈 값을 묻는 문제 번호입니다. (⑥ Service Name · ⑦ Host · ⑧ Port · ⑨ User name · ⑩ Password · ⑪ Catalog)"));
      list.appendChild(fig);
    }
    var card = el("section", "card q");
    var qh = el("div", "qh");
    qh.appendChild(el("span", "no", (i + 1) + "."));
    qh.appendChild(el("span", "qt", Q.q));
    Q.markEl = el("span", "mark", "");
    qh.appendChild(Q.markEl);
    card.appendChild(qh);
    if (Q.ctx) card.appendChild(el("pre", "ctx", Q.ctx));
    var row = el("label", "ansrow");
    row.setAttribute("for", "a" + i);
    row.appendChild(el("span", "anslab", "답"));
    var inp = document.createElement("input");
    inp.className = "ansin"; inp.id = "a" + i; inp.type = "text";
    inp.setAttribute("autocomplete", "off"); inp.setAttribute("autocapitalize", "off"); inp.setAttribute("spellcheck", "false");
    row.appendChild(inp);
    card.appendChild(row);
    Q.exEl = el("div", "explain"); Q.exEl.hidden = true;
    card.appendChild(Q.exEl);
    Q.card = card; Q.inp = inp;
    list.appendChild(card);
  });
}
function needId() {
  var sid = $("sid").value.trim(), sname = $("sname").value.trim();
  $("sid").classList.toggle("need", !sid);
  $("sname").classList.toggle("need", !sname);
  if (!sid || !sname) {
    var w = $("warn"); w.textContent = "학번과 이름을 입력해야 채점됩니다."; w.hidden = false;
    $("idcard").scrollIntoView({ block: "start" });
    (!sid ? $("sid") : $("sname")).focus();
    return null;
  }
  $("warn").hidden = true;
  return { sid: sid, sname: sname };
}
function gradeAll() {
  var id = needId();
  if (!id) return;
  S.tries++;
  var correct = 0;
  QS.forEach(function (Q, i) {
    var v = Q.inp.value, ok = v.trim() !== "" && Q.ok(v);
    Q.card.classList.toggle("ok", ok);
    Q.card.classList.toggle("ng", !ok);
    Q.markEl.textContent = ok ? "O" : "X";
    if (ok) {
      correct++;
      S.solved[i] = true;
      Q.inp.disabled = true;
      Q.exEl.hidden = true;
    } else {
      Q.exEl.innerHTML = "";
      var tip = Q.tips && Q.tips[norm(v)];
      if (!tip && Q.ok.isCombo && v.trim() && v.indexOf("+") < 0) tip = "누르는 키 이름을 + 로 연결해서 쓰세요. (예: Ctrl+C)";
      if (!v.trim()) { Q.exEl.className = "explain"; Q.exEl.appendChild(el("b", null, "답을 쓰지 않았습니다. ")); Q.exEl.appendChild(document.createTextNode(Q.ex)); }
      else if (tip) { Q.exEl.className = "explain tip"; Q.exEl.appendChild(el("b", null, "다시 생각해 보세요. ")); Q.exEl.appendChild(document.createTextNode(tip)); }
      else { Q.exEl.className = "explain"; Q.exEl.appendChild(el("b", null, "설명 ")); Q.exEl.appendChild(document.createTextNode(Q.ex)); }
      Q.exEl.hidden = false;
    }
  });
  var score = correct * 5;
  if (S.first === null) S.first = score;
  $("okCnt").textContent = correct;
  $("tries").textContent = S.tries;
  showResult(id, score, correct);
}
function showResult(id, score, correct) {
  var res = $("res"), now = new Date(), perfect = score === 100;
  res.className = "card result" + (perfect ? " perfect" : "");
  res.innerHTML = "";
  res.appendChild(el("p", "rtitle", "개발환경 구축하기 최종 점검 결과"));
  var who = el("p", "who");
  who.appendChild(el("span", null, id.sid)); who.appendChild(document.createTextNode(" ")); who.appendChild(el("span", null, id.sname));
  res.appendChild(who);
  res.appendChild(el("div", "score", score + "점"));
  if (perfect) res.appendChild(el("div", "stamp", "✓ 100점 달성 · 캡처해서 제출하세요"));
  else res.appendChild(el("p", "retry", "틀린 " + (20 - correct) + "문제의 설명을 읽고 답을 고친 뒤 다시 [채점하기]를 누르세요."));
  res.appendChild(el("p", "rdetail", "20문제 중 " + correct + "개 정답 · 첫 채점 " + S.first + "점 · 채점 " + S.tries + "회"));
  var g = el("div", "grid");
  QS.forEach(function (Q, i) { var ok = !!S.solved[i]; var c = el("div", ok ? "o" : "x"); c.appendChild(document.createTextNode(String(i + 1))); c.appendChild(el("b", null, ok ? "O" : "X")); g.appendChild(c); });
  res.appendChild(g);
  res.appendChild(el("p", "meta", "채점 " + stamp(now)));
  res.hidden = false;
  if (perfect) {
    S.done = true;
    $("bar").hidden = true;
    $("sid").disabled = true; $("sname").disabled = true;
    res.scrollIntoView({ block: "start" });
  } else {
    var firstWrong = QS.filter(function (Q, i) { return !S.solved[i]; })[0];
    res.scrollIntoView({ block: "start" });
    if (firstWrong) setTimeout(function () { firstWrong.inp.focus({ preventScroll: true }); }, 300);
  }
  $("toast").hidden = true;
}

/* ───── 복사·붙여넣기 차단, 두 창 잠금 ───── */
var toastT = null;
function toast(msg) { var t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 2400); }
function blockInput(e) { e.preventDefault(); toast("복사·붙여넣기는 쓸 수 없습니다. 직접 입력하세요."); }
function lockDuplicate() {
  if (!$("dup").hidden) return;
  S = { tries: 0, first: null, solved: {}, done: false };
  build(); $("res").hidden = true;
  $("dup").hidden = false; $("bar").hidden = true;
}
function watchOtherWindows() {
  var me = Math.random().toString(36).slice(2), send, ch = null;
  function onMsg(x) { if (!x || x.id === me) return; if (x.type === "hello") send({ type: "here", id: me }); lockDuplicate(); }
  try { ch = new BroadcastChannel("devenv-final-check"); } catch (e) { ch = null; }
  if (ch) { ch.onmessage = function (e) { onMsg(e.data); }; send = function (x) { try { ch.postMessage(x); } catch (e) {} }; }
  else {
    window.addEventListener("storage", function (e) { if (e.key === "devenv-final-check" && e.newValue) { try { onMsg(JSON.parse(e.newValue)); } catch (x) {} } });
    send = function (x) { try { x.t = Date.now(); localStorage.setItem("devenv-final-check", JSON.stringify(x)); } catch (e) {} };
  }
  send({ type: "hello", id: me });
}

(function init() {
  build();
  $("gradeBtn").addEventListener("click", gradeAll);
  ["sid", "sname"].forEach(function (id) { $(id).addEventListener("input", function () { this.classList.remove("need"); $("warn").hidden = true; }); });
  ["copy", "cut", "paste", "drop", "dragstart"].forEach(function (t) { document.addEventListener(t, blockInput, true); });
  document.addEventListener("beforeinput", function (e) { if (/^insertFrom(Paste|Drop|Yank)/.test(e.inputType || "")) blockInput(e); }, true);
  document.addEventListener("contextmenu", function (e) { if (e.target && e.target.tagName === "INPUT") e.preventDefault(); }, true);
  watchOtherWindows();
})();
</script>

<script src="../../assets/common.js"></script>
