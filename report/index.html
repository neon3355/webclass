<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 과제 현황</title>
<link rel="stylesheet" href="../assets/common.css">
<style>
.sheet { border: 2px solid var(--accent); }
.sheet .top { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 12px; }
.sheet .who { font-size: 22px; font-weight: 800; color: var(--accent); margin: 0; }
.sheet .when { margin-left: auto; color: var(--sub); font-size: 14px; font-variant-numeric: tabular-nums; }
.sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 14px; }
.sum div { background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; }
.sum b { display: block; font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; }
.sum span { font-size: 13px; color: var(--sub); }
.tabs { display: flex; gap: 6px; margin: 0 0 12px; }
.tabs button { font: inherit; font-size: 14px; font-weight: 700; padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); color: var(--sub); cursor: pointer; }
.tabs button[aria-pressed=true] { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
table.tbl td.num { text-align: right; white-space: nowrap; }
table.tbl tr.grp th { background: var(--bg); color: var(--sub); font-size: 13px; }
.empty { text-align: center; color: var(--sub); padding: 26px 0; }
.sendmsg { font-weight: 700; margin: 8px 0 0; min-height: 1.5em; }
</style>
</head>
<body data-wc-page>
<main class="wrap">
  <h1>내 과제 현황</h1>
  <p class="lead" id="lead">이 화면을 <b>캡처해서 제출</b>하세요. 학번·이름과 날짜, 활동 기록이 한 화면에 보여야 합니다.</p>
  <div class="tabs" role="group" aria-label="기간">
    <button type="button" id="tToday" aria-pressed="true">오늘 한 것</button>
    <button type="button" id="tDays" aria-pressed="false">날짜별</button>
    <button type="button" id="tAll" aria-pressed="false">전체 기록</button>
  </div>
  <div class="card sheet">
    <div class="top"><p class="who" id="who"></p><span class="when" id="when"></span></div>
    <div class="sum" id="sum"></div>
    <div class="tablewrap" id="box"></div>
  </div>
  <div class="row" style="margin-top:14px"><a class="btn ghost" href="../index.html">처음 화면으로</a></div>
  <p class="note" id="foot" style="text-align:center"></p>
</main>
<script src="../assets/config.js"></script>
<script src="../assets/common.js"></script>
<script>
(function () {
  var u = WC.user(); if (!u) return;
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  var GROUPS = ["타자 연습", "코드 연습", "형성평가"], view = "today";
  if (WC.online) {
    $("lead").textContent = "내 연습 기록입니다. 기록은 자동으로 선생님께 전달됩니다.";
    $("foot").textContent = "어느 컴퓨터에서 로그인해도 같은 기록이 보입니다.";
  } else $("foot").textContent = "기록은 지금 쓰는 컴퓨터의 브라우저에 저장됩니다. 다른 컴퓨터에서 한 기록은 여기에 나오지 않습니다.";

  function table(heads) { var t = el("table", "tbl"), hr = el("tr"); heads.forEach(function (h) { hr.appendChild(el("th", null, h)); }); t.appendChild(hr); return t; }
  function sumBox(items) {
    var sum = $("sum"); sum.innerHTML = "";
    items.forEach(function (s) { var d = el("div"); d.appendChild(el("b", null, s[1])); d.appendChild(el("span", null, s[0])); sum.appendChild(d); });
  }
  function drawRecords(log, emptyMsg) {
    var rec = WC.summarize(log), rows = Object.keys(rec).map(function (id) { return { id: id, r: rec[id] }; });
    rows.sort(function (a, b) { var g = GROUPS.indexOf(a.r.group) - GROUPS.indexOf(b.r.group); return g || (a.id < b.id ? -1 : 1); });
    var n = {}, done = 0, speed = 0;
    rows.forEach(function (x) { n[x.r.group] = (n[x.r.group] || 0) + 1; if (x.r.pass) done++; if (x.r.group === "타자 연습") speed = Math.max(speed, x.r.best); });
    sumBox([["타자 연습", (n["타자 연습"] || 0) + "단계"], ["타자 최고", speed + "타"], ["코드 연습", (n["코드 연습"] || 0) + "개"], ["형성평가", (n["형성평가"] || 0) + "개"], ["목표 달성", done + "개"]]);
    var box = $("box"); box.innerHTML = "";
    if (!rows.length) { box.appendChild(el("p", "empty", emptyMsg)); return; }
    var t = table(["활동", "최고", "최근", "횟수", "결과", "마지막으로 한 때"]), g = null;
    rows.forEach(function (x) {
      var r = x.r;
      if (r.group !== g) { g = r.group; var gr = el("tr", "grp"), th = el("th", null, g); th.colSpan = 6; gr.appendChild(th); t.appendChild(gr); }
      var tr = el("tr");
      tr.appendChild(el("td", null, r.title));
      tr.appendChild(el("td", "num", r.best + r.unit)); tr.appendChild(el("td", "num", r.last + r.unit)); tr.appendChild(el("td", "num", r.count + "회"));
      var td = el("td"); td.appendChild(el("span", "badge " + (r.pass ? "ok" : "mid"), r.pass ? "달성" : "연습 중")); tr.appendChild(td);
      tr.appendChild(el("td", "num", WC.stamp(r.lastTs)));
      t.appendChild(tr);
    });
    box.appendChild(t);
  }
  function drawDays(log) {
    var days = {};
    log.forEach(function (x) {
      var d = WC.today(x.ts), o = days[d] || (days[d] = { n: 0, typing: 0, speed: 0, code: 0, codeOk: 0, quiz: 0, quizBest: 0, login: 0 });
      if (x.group === "접속") { o.login++; return; }
      o.n++;
      if (x.group === "타자 연습") { o.typing++; o.speed = Math.max(o.speed, x.score); }
      else if (x.group === "코드 연습") { o.code++; if (x.pass) o.codeOk++; }
      else if (x.group === "형성평가") { o.quiz++; o.quizBest = Math.max(o.quizBest, x.score); }
    });
    var keys = Object.keys(days).sort().reverse(), total = 0;
    keys.forEach(function (k) { total += days[k].n; });
    sumBox([["연습한 날", keys.filter(function (k) { return days[k].n; }).length + "일"], ["전체 활동", total + "번"]]);
    var box = $("box"); box.innerHTML = "";
    if (!keys.length) { box.appendChild(el("p", "empty", "아직 기록이 없습니다.")); return; }
    var heads = ["날짜", "타자 연습", "코드 연습", "형성평가", "합계"]; if (WC.online) heads.push("로그인");
    var t = table(heads);
    keys.forEach(function (k) {
      var o = days[k], tr = el("tr");
      tr.appendChild(el("td", "num", k));
      tr.appendChild(el("td", null, o.typing ? o.typing + "번 · 최고 " + o.speed + "타" : "-"));
      tr.appendChild(el("td", null, o.code ? o.code + "번 · 완료 " + o.codeOk + "번" : "-"));
      tr.appendChild(el("td", null, o.quiz ? o.quiz + "번 · 최고 " + o.quizBest + "점" : "-"));
      tr.appendChild(el("td", "num", o.n + "번"));
      if (WC.online) tr.appendChild(el("td", "num", o.login + "번"));
      t.appendChild(tr);
    });
    box.appendChild(t);
  }
  function draw() {
    var log = WC.log(), today = WC.today();
    $("who").textContent = u.sid + " " + u.name;
    $("when").textContent = ({ today: "오늘 기록", days: "날짜별 기록", all: "전체 기록" })[view] + " · " + WC.stamp(Date.now());
    ["today", "days", "all"].forEach(function (v) { $({ today: "tToday", days: "tDays", all: "tAll" }[v]).setAttribute("aria-pressed", String(v === view)); });
    if (view === "days") drawDays(log);
    else if (view === "today") drawRecords(log.filter(function (x) { return WC.today(x.ts) === today; }), "오늘 한 활동이 아직 없습니다. 타자 연습부터 시작하세요.");
    else drawRecords(log, "아직 기록이 없습니다.");
  }
  $("tToday").addEventListener("click", function () { view = "today"; draw(); });
  $("tDays").addEventListener("click", function () { view = "days"; draw(); });
  $("tAll").addEventListener("click", function () { view = "all"; draw(); });
  draw();
  if (WC.online) WC.sync().then(function (ok) { if (ok) draw(); });
})();
</script>
</body>
</html>
