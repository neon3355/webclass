<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코드 연습</title>
<link rel="stylesheet" href="../assets/common.css">
<style>
.file h3 { margin: 0; font-size: 18px; font-family: Consolas, "D2Coding", Menlo, monospace; }
.file p { margin: 2px 0 8px; font-size: 14px; color: var(--sub); }
.file .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.file .acts .btn { padding: 8px 14px; font-size: 15px; }
.file .sts { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; min-height: 22px; }
.head2 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.head2 .meta { margin-left: auto; font-size: 14px; color: var(--sub); font-variant-numeric: tabular-nums; }
.codepanel { background: var(--code-bg); color: var(--code-text); border-radius: 12px; padding: 12px 0; font-family: Consolas, "D2Coding", Menlo, monospace; font-size: 15px; line-height: 1.7; overflow: auto; max-height: 62vh; }
.haspv .codepanel { max-height: 40vh; }
.cols { display: flex; flex-direction: column; }
.cols .pv { order: 2; margin: 12px 0 0; }
@media (min-width: 1000px) {
  main.wide { max-width: 1280px; }
  .haspv .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  .haspv .cols .pv { order: 2; margin: 0; }
  .haspv .codepanel { max-height: 58vh; }
}
.pv { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 12px; background: var(--card); }
.pv .pvh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 10px; background: var(--accent-soft); font-size: 13px; font-weight: 700; }
.pv .pvh .url { font-family: Consolas, "D2Coding", Menlo, monospace; font-weight: 400; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; }
.pv .pvh .sw { margin-left: auto; display: flex; gap: 4px; }
.pv .pvh button { font: inherit; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--sub); cursor: pointer; }
.pv .pvh button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.pv .pvbox { overflow: hidden; }
.pv iframe { display: block; width: 100%; height: 400px; border: 0; background: #fff; pointer-events: none; transform-origin: 0 0; }
.asg { margin: 22px 0 10px; } .asg h2 { margin: 0; } .asg p { margin: 0; color: var(--sub); font-size: 14px; }
.ln { display: grid; grid-template-columns: 44px 1fr; white-space: pre; padding-right: 14px; }
.ln .no { text-align: right; padding-right: 12px; color: var(--code-dim); user-select: none; font-size: 12px; line-height: 2.1; }
.ln.auto .tx { color: var(--code-dim); font-style: italic; }
.ln.todo .tx { color: var(--code-dim); }
.ln.done .tx { color: var(--code-ok); }
.ln.help .tx { color: #ffd166; }
.ln.cur { background: #24344a; box-shadow: inset 3px 0 0 var(--code-key); }
.ln.cur .tx { color: #fff; white-space: pre-wrap; word-break: break-all; }
.ln.cur .hint { color: var(--code-key); font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; white-space: normal; }
.dock { position: sticky; bottom: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px 12px 0 0; padding: 12px; margin-top: 12px; box-shadow: 0 -4px 14px rgba(0,0,0,.08); }
.dock .rowin { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
.codein { flex: 1 1 320px; min-width: 0; font-family: Consolas, "D2Coding", Menlo, monospace; font-size: 17px; padding: 10px 12px; border-radius: 8px; border: 2px solid var(--line); background: var(--bg); color: var(--text); }
.codein.err { border-color: var(--ng); }
.msg { margin-top: 8px; font-size: 14px; font-weight: 600; min-height: 1.6em; }
.msg.ng { color: var(--ng); } .msg.ok { color: var(--ok); }
.msg code { background: var(--accent-soft); color: var(--text); padding: 1px 5px; border-radius: 4px; }
.tip { margin-top: 6px; font-size: 14px; background: var(--mid-soft); color: var(--text); border-left: 4px solid var(--mid); border-radius: 6px; padding: 6px 10px; }
.legend2 { font-size: 13px; color: var(--sub); margin: 8px 0 0; }
</style>
</head>
<body data-wc-page>
<main class="wrap">
  <!-- 파일 목록 -->
  <section id="menu" hidden>
    <h1>코드 연습</h1>
    <p class="lead">수업 코드를 한 줄씩 직접 씁니다. <b>보고 쓰기</b>로 손에 익히고, <b>외워 쓰기</b>로 설명만 보고 쓰고, 마지막에 <b>백지 쓰기</b>로 아무것도 없이 써 보세요. 들여쓰기와 띄어쓰기 개수는 달라도 됩니다.</p>
    <div id="files"></div>
  </section>

  <!-- 연습 -->
  <section id="play" hidden>
    <div class="head2"><h1 id="fname" class="mono"></h1><span class="badge mid" id="mname"></span><span class="meta">줄 <b id="pi">0</b> / <b id="pn">0</b> · 시간 <b id="tm">00:00</b></span></div>
    <p class="lead" id="mdesc"></p>
    <div class="cols">
    <div class="pv" id="pv" hidden>
      <div class="pvh"><span>실행 화면</span><span class="url" id="pvUrl"></span>
        <span class="sw" role="group" aria-label="실행 화면 종류"><button type="button" id="pvLive" aria-pressed="true">지금까지 쓴 코드</button><button type="button" id="pvFull" aria-pressed="false">완성 화면</button></span></div>
      <div class="pvbox" id="pvBox"><iframe id="pvFrame" title="실행 화면 미리보기" sandbox="" tabindex="-1"></iframe></div>
    </div>
    <div class="codepanel" id="panel"></div>
    </div>
    <p class="legend2">회색 기울임 글씨는 Eclipse가 자동으로 만들어 주는 줄이라 쓰지 않습니다. 파란 줄이 지금 쓸 줄입니다.</p>
    <div class="dock">
      <div class="rowin">
        <input class="codein" id="codein" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="지금 쓸 줄을 입력">
        <button class="btn" type="button" id="okBtn">확인 (Enter)</button>
        <button class="btn ghost" type="button" id="peekBtn" hidden>보기</button>
      </div>
      <div class="msg" id="msg"></div>
      <div class="tip" id="tip" hidden></div>
    </div>
  </section>

  <!-- 결과 -->
  <section id="done" hidden><div class="card result" id="res"></div></section>
</main>
<script src="../assets/config.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/common.js"></script>
<script>
(function () {
  var u = WC.user(); if (!u) return;
  WC.blockPaste();
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  var MODES = { 1: { name: "보고 쓰기", desc: "파란 줄에 보이는 코드를 그대로 쓰고 Enter를 누르세요." },
                2: { name: "외워 쓰기", desc: "코드는 가려져 있습니다. 파란 줄의 설명을 보고 코드를 쓰세요. 정말 모르겠으면 [보기]를 누르세요. (본 줄은 기록됩니다)" },
                3: { name: "백지 쓰기", desc: "설명도 코드도 없습니다. 시험처럼 처음부터 끝까지 기억해서 쓰세요. style.css는 묶음 순서와 묶음 안의 줄 순서가 달라도 됩니다. 막히면 [힌트] → [보기] 순서로 도움을 받을 수 있습니다. (도움 받은 줄은 기록됩니다)" } };
  var BASE = { 1: 2, 2: 1, 3: 0 };   // 처음에 보여 주는 정도: 2 = 코드, 1 = 설명, 0 = 아무것도 없음
  function fill(s) { return s.replace(/\{sid\}/g, u.sid).replace(/\{name\}/g, u.name); }
  /* 비교: 들여쓰기·띄어쓰기 개수 무시, 기호 주변 공백 무시, ⓒ는 (c)·©도 인정 */
  function norm(s) { return s.replace(/\(c\)|©/gi, "ⓒ").trim().replace(/\s+/g, " ").replace(/\s*([:;{}=<>])\s*/g, "$1"); }
  function indent(n) { return new Array((n || 0) + 1).join("    "); }

  /* ───── 목록 ───── */
  function menu() {
    $("menu").hidden = false; $("play").hidden = true; $("done").hidden = true;
    var box = $("files"), rec = WC.records(), as = WC.assignments().slice().reverse();
    box.innerHTML = "";
    if (!as.length) { box.appendChild(el("p", "card", "아직 배포된 과제가 없습니다. 선생님이 과제를 배포하면 여기에 나타납니다. 그동안 타자 연습을 하세요.")); return; }
    as.forEach(function (A, i) {
      var head = el("div", "asg");
      head.appendChild(el("h2", null, (WC.online ? (i === 0 ? "이번 과제 · " : "지난 과제 · ") : "") + A.name + " — " + A.title));
      box.appendChild(head);
      var grid = el("div", "grid");
      A.files.forEach(function (f) {
        var n = f.lines.filter(function (l) { return l.t; }).length;
        var card = el("div", "card file");
        card.appendChild(el("h3", null, f.name));
        card.appendChild(el("p", null, f.desc + " · 직접 쓰는 줄 " + n + "개"));
        var sts = el("div", "sts");
        [1, 2, 3].forEach(function (m) {
          var r = rec["code:" + A.id + ":" + f.id + ":" + m];
          if (r) sts.appendChild(el("span", "badge " + (r.pass ? "ok" : "mid"), MODES[m].name + " " + (r.pass ? "완료" : "도움 받음") + " · " + r.count + "회"));
        });
        card.appendChild(sts);
        var acts = el("div", "acts");
        [1, 2, 3].forEach(function (m) {
          var a = el("a", "btn" + (m > 1 ? " ghost" : ""), MODES[m].name); a.href = "?a=" + A.id + "&f=" + f.id + "&m=" + m; acts.appendChild(a);
        });
        card.appendChild(acts);
        grid.appendChild(card);
      });
      box.appendChild(grid);
    });
  }

  /* ───── 실행 화면 미리보기 ─────
     JSP를 Tomcat에서 실행했을 때 브라우저에 보이는 화면을 흉내 냅니다.
     jsp:include 는 그 파일의 내용으로 바꾸고, style.css 는 link 가 연결된 뒤에만 적용합니다. */
  var pvFull = false;
  function fileOf(A, id) { return A.files.filter(function (x) { return x.id === id; })[0]; }
  function bodyHtml(A, lines, all) {      // lines: 연습 중인 줄(상태 포함) 또는 원본 줄
    var html = "", css = false, inBody = false;
    lines.forEach(function (l) {
      if (l.auto) { if (/^<body>/.test(l.auto)) inBody = true; if (/^<\/body>/.test(l.auto)) inBody = false; return; }
      if (!l.t || !(all || l.st === "done" || l.st === "help")) return;
      var t = fill(l.t);
      if (/<link [^>]*style\.css/.test(t)) { css = true; return; }
      var inc = /<jsp:include page="(\w+)\.jsp">/.exec(t);
      if (inc) { var f = fileOf(A, inc[1]); if (f) { var sub = bodyHtml(A, f.lines, true); html += sub.html; css = css || sub.css; } return; }
      if (inBody) html += t.replace(/\son\w+="[^"]*"/g, "") + "\n";   // 미리보기에서는 onclick 을 실행하지 않음
    });
    return { html: html, css: css };
  }
  function drawPreview() {
    var has = !!S && S.f.id !== "style";
    $("pv").hidden = !has; $("play").classList.toggle("haspv", has); document.querySelector("main").classList.toggle("wide", has);
    if (!has) return;
    fitPreview();
    $("pvUrl").textContent = "localhost:8080/…/" + S.f.name;
    $("pvLive").setAttribute("aria-pressed", String(!pvFull)); $("pvFull").setAttribute("aria-pressed", String(pvFull));
    var r = bodyHtml(S.A, pvFull ? S.f.lines : S.lines, pvFull);
    var css = r.css ? fileOf(S.A, "style").lines.map(function (l) { return l.t || ""; }).join("\n") : "";
    var doc = "<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><style>" + css + "</style></head><body>" + r.html + "</body></html>";
    if (S.pvDoc !== doc) { S.pvDoc = doc; $("pvFrame").srcdoc = doc; }
  }
  /* 좁은 화면에서는 640px 너비로 그린 뒤 줄여서 보여 줌 (글자가 잘리지 않게) */
  function fitPreview() {
    var box = $("pvBox"), fr = $("pvFrame"), w = box.clientWidth, k = w && w < 640 ? w / 640 : 1;
    fr.style.width = k < 1 ? "640px" : "100%"; fr.style.transform = k < 1 ? "scale(" + k + ")" : ""; box.style.height = Math.round(400 * k) + "px";
  }
  window.addEventListener("resize", function () { if (S) fitPreview(); });
  $("pvLive").addEventListener("click", function () { pvFull = false; drawPreview(); $("codein").focus(); });
  $("pvFull").addEventListener("click", function () { pvFull = true; drawPreview(); $("codein").focus(); });

  /* ───── 연습 ───── */
  var S = null, timer = null;
  function start(A, f, m) {
    var lines = f.lines.map(function (l) { return { t: l.t ? fill(l.t) : null, auto: l.auto, blank: l.blank, h: l.h ? fill(l.h) : "", tip: l.tip || "", in: l.in || 0, st: l.t ? "todo" : "auto" }; });
    pvFull = m === 3;     // 백지 쓰기는 완성 화면을 보면서 쓴다
    S = { A: A, f: f, m: m, lines: lines, cur: -1, start: null, tries: 0, firstOk: 0, helped: 0, errs: 0, total: lines.filter(function (l) { return l.t; }).length, doneN: 0 };
    $("menu").hidden = true; $("done").hidden = true; $("play").hidden = false;
    $("fname").textContent = f.name; $("mname").textContent = MODES[m].name; $("mdesc").textContent = MODES[m].desc;
    $("pn").textContent = S.total; $("peekBtn").hidden = m === 1;
    /* style.css 는 순서가 달라도 결과가 같으므로(외워·백지 쓰기) 묶음 안에서는 아무 순서로 써도 인정한다.
       role: open = "header {", decl = 속성 줄, close = "}", single = 한 줄짜리 묶음 */
    S.free = f.id === "style" && m > 1; S.open = -1;
    if (S.free) {
      var blk = -1, inside = false;
      lines.forEach(function (l) {
        if (!l.t) return;
        var n = norm(l.t);
        if (!inside && /\{.*\}$/.test(n)) { blk++; l.blk = blk; l.role = "single"; }
        else if (!inside && /\{$/.test(n)) { blk++; l.blk = blk; l.role = "open"; inside = true; }
        else if (n === "}") { l.blk = blk; l.role = "close"; inside = false; }
        else { l.blk = blk; l.role = "decl"; }
      });
    }
    advance();
    clearInterval(timer); timer = setInterval(function () { if (S) $("tm").textContent = WC.mmss(S.start ? Date.now() - S.start : 0); }, 500);
  }
  /* 지금 써도 되는 줄들 */
  function eligible() {
    var todo = S.lines.filter(function (l) { return l.t && l.st !== "done" && l.st !== "help"; });
    if (!S.free) return todo.slice(0, 1);
    if (S.open < 0) return todo.filter(function (l) { return l.role === "open" || l.role === "single"; });
    var decl = todo.filter(function (l) { return l.blk === S.open && l.role === "decl"; });
    return decl.length ? decl : todo.filter(function (l) { return l.blk === S.open && l.role === "close"; });
  }
  function advance() {
    S.lines.forEach(function (l) { if (l.st === "cur") l.st = "todo"; });
    var el0 = eligible()[0], i = el0 ? S.lines.indexOf(el0) : S.lines.length;
    S.cur = i; S.tries = 0; S.peeked = false; S.lv = BASE[S.m];
    $("peekBtn").textContent = S.lv === 0 ? "힌트" : "보기"; $("peekBtn").disabled = false;
    if (i >= S.lines.length) return finish();
    S.lines[i].st = "cur";
    $("tip").hidden = !S.lines[i].tip; $("tip").textContent = S.lines[i].tip ? "💡 " + S.lines[i].tip : "";
    render();
    var inp = $("codein"); inp.value = ""; inp.classList.remove("err"); inp.focus();
  }
  function render() {
    var p = $("panel"); p.innerHTML = "";
    var curEl = null, no = 0;
    S.lines.forEach(function (l) {
      no++;
      var row = el("div", "ln " + (l.blank ? "auto" : l.st));
      row.appendChild(el("span", "no", String(no)));
      var tx = el("span", "tx");
      if (l.blank) tx.textContent = " ";
      else if (l.auto) tx.textContent = l.auto;
      else if (l.st === "done" || l.st === "help") tx.textContent = indent(l.in) + l.t;
      else if (l.st === "cur") {
        if (S.lv >= 2) tx.textContent = indent(l.in) + l.t;
        else { tx.textContent = indent(l.in); tx.appendChild(el("span", "hint", S.lv === 1 ? "▶ " + l.h : "▶ 여기에 들어갈 코드를 기억해서 쓰세요")); }
        curEl = row;
      } else tx.textContent = S.m === 1 ? indent(l.in) + l.t : indent(l.in) + "· · ·";
      row.appendChild(tx);
      p.appendChild(row);
    });
    $("pi").textContent = S.doneN;
    if (curEl) p.scrollTop = Math.max(0, curEl.offsetTop - p.offsetTop - p.clientHeight / 2);
    drawPreview();
  }
  function msg(cls, parts) {
    var m = $("msg"); m.className = "msg " + cls; m.innerHTML = "";
    parts.forEach(function (x) { if (typeof x === "string") m.appendChild(document.createTextNode(x)); else m.appendChild(el("code", null, x.code)); });
  }
  function check() {
    if (!S || S.cur >= S.lines.length) return;
    var inp = $("codein"), v = inp.value, l = S.lines[S.cur];
    if (!v.trim()) { msg("ng", ["코드를 입력하고 Enter를 누르세요."]); return; }
    if (!S.start) S.start = Date.now();
    var a = norm(v), b = norm(l.t), can = eligible();
    var hit = can.filter(function (c) { return norm(c.t) === a; })[0];
    if (hit) {
      var same = hit === l;
      if (S.tries === 0 && !S.peeked) S.firstOk++;
      if (S.peeked && same) { S.helped++; hit.st = "help"; } else hit.st = "done";
      if (S.free) { if (hit.role === "open") S.open = hit.blk; else if (hit.role === "close") S.open = -1; }
      S.doneN++;
      msg("ok", ["✓ 맞았습니다."]);
      advance();
      return;
    }
    if (S.free) {
      var left = S.lines.filter(function (c) { return c.t && c.blk === S.open && c.role === "decl" && c.st !== "done" && c.st !== "help"; }).length;
      if (a === "}" && S.open >= 0 && left) { S.tries++; S.errs++; inp.classList.add("err"); msg("ng", ["✗ 아직 이 묶음 안에 써야 할 줄이 " + left + "개 남았습니다."]); inp.focus(); return; }
      if (S.lines.some(function (c) { return c.t && (c.st === "done" || c.st === "help") && (S.open < 0 ? c.role === "open" || c.role === "single" : c.blk === S.open) && norm(c.t) === a; })) { msg("ng", ["이미 쓴 줄입니다. 다른 줄을 쓰세요."]); inp.focus(); return; }
      /* 가장 비슷한 줄을 기준으로 어디까지 맞았는지 알려 준다 */
      var bestK = -1;
      can.forEach(function (c) { var t = norm(c.t), k2 = 0; while (k2 < a.length && k2 < t.length && a.charAt(k2) === t.charAt(k2)) k2++; if (k2 > bestK) { bestK = k2; b = t; } });
    }
    S.tries++; S.errs++;
    inp.classList.add("err");
    var k = 0; while (k < a.length && k < b.length && a.charAt(k) === b.charAt(k)) k++;
    if (k === 0) msg("ng", ["✗ 첫 글자부터 다릅니다. 다시 확인하세요."]);
    else if (k >= b.length) msg("ng", ["✗ 끝에 필요 없는 글자가 더 있습니다."]);
    else if (k >= a.length) msg("ng", ["✗ 여기까지는 맞습니다: ", { code: a }, " — 뒤에 더 써야 합니다."]);
    else msg("ng", ["✗ 여기까지는 맞습니다: ", { code: a.slice(0, k) }, " — 그다음 글자부터 다릅니다."]);
    inp.focus();
  }
  $("okBtn").addEventListener("click", check);
  $("codein").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); check(); } });
  $("codein").addEventListener("input", function () { this.classList.remove("err"); if (S && !S.start && this.value) S.start = Date.now(); });
  $("peekBtn").addEventListener("click", function () {
    if (!S || S.m === 1 || S.cur >= S.lines.length || S.lv >= 2) return;
    S.lv++; S.peeked = true; render();
    $("peekBtn").textContent = "보기"; $("peekBtn").disabled = S.lv >= 2;
    msg("ng", [S.lv === 1 ? "설명을 보여 줍니다. 이 줄은 「도움 받음」으로 기록됩니다." : "코드를 보여 줍니다. 보고 그대로 쓰세요. 이 줄은 「도움 받음」으로 기록됩니다."]);
    $("codein").focus();
  });

  function finish() {
    clearInterval(timer);
    var A = S.A, f = S.f, m = S.m, time = S.start ? Date.now() - S.start : 0;
    var acc = Math.round(S.firstOk / S.total * 100), pass = m === 1 ? true : S.helped === 0;
    var detail = "한 번에 맞힌 줄 " + S.firstOk + "/" + S.total + (m > 1 ? " · 도움 받은 줄 " + S.helped : "") + " · " + WC.mmss(time);
    WC.addRecord("code:" + A.id + ":" + f.id + ":" + m, { group: "코드 연습", title: A.name + " · " + f.name + " " + MODES[m].name, score: acc, unit: "%", detail: detail, pass: pass });
    $("play").hidden = true; $("done").hidden = false;
    var res = $("res"); res.innerHTML = "";
    res.appendChild(el("p", "rtitle", "코드 연습 결과 · " + f.name + " " + MODES[m].name));
    res.appendChild(el("p", "who", u.sid + " " + u.name));
    var sc = el("div", "score", String(acc)); sc.appendChild(el("small", null, " %")); res.appendChild(sc);
    res.appendChild(el("p", "rdetail", detail + " · 틀린 횟수 " + S.errs + "번 · " + WC.stamp(Date.now())));
    if (pass) res.appendChild(el("div", "stamp", "✓ " + f.name + " " + MODES[m].name + " 완료"));
    else res.appendChild(el("p", "again", "도움 받은 줄이 " + S.helped + "개 있습니다. 도움 없이 끝까지 쓸 수 있을 때까지 다시 해 보세요."));
    var row = el("div", "row");
    var again = el("a", "btn ghost", "한 번 더"); again.href = "?a=" + A.id + "&f=" + f.id + "&m=" + m; row.appendChild(again);
    if (m === 1) { var nx = el("a", "btn", "외워 쓰기 도전"); nx.href = "?a=" + A.id + "&f=" + f.id + "&m=2"; row.appendChild(nx); }
    else if (m === 2 && pass) { var nx3 = el("a", "btn", "백지 쓰기 도전"); nx3.href = "?a=" + A.id + "&f=" + f.id + "&m=3"; row.appendChild(nx3); }
    else if (pass) {
      var idx = A.files.indexOf(f), nf = A.files[idx + 1];
      if (nf) { var nb = el("a", "btn", "다음 파일: " + nf.name); nb.href = "?a=" + A.id + "&f=" + nf.id + "&m=1"; row.appendChild(nb); }
    }
    var mb = el("a", "btn ghost", "파일 목록"); mb.href = "index.html"; row.appendChild(mb);
    res.appendChild(row);
    S = null;
    window.scrollTo(0, 0);
  }

  var q = new URLSearchParams(location.search), m = ({ "2": 2, "3": 3 })[q.get("m")] || 1;
  function go() {
    var A = WC.assignments().filter(function (x) { return x.id === q.get("a"); })[0];
    var f = A && A.files.filter(function (x) { return x.id === q.get("f"); })[0];
    if (f) start(A, f, m); else menu();
  }
  go();
  if (WC.online && !S) WC.sync().then(function (ok) { if (ok) go(); });   // 새로 배포된 과제 확인 (목록이 보일 때만)
})();
</script>
</body>
</html>
