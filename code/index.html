<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코드 연습</title>
<link rel="stylesheet" href="../assets/common.css">
<style>
.file h3 { margin: 0; font-size: 18px; font-family: Consolas, "D2Coding", Menlo, monospace; }
.file p { margin: 2px 0 8px; font-size: 14px; color: var(--sub); }
.file .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.file .acts .btn { padding: 8px 14px; font-size: 15px; }
.file .sts { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; min-height: 22px; }
.head2 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.head2 .meta { margin-left: auto; font-size: 14px; color: var(--sub); font-variant-numeric: tabular-nums; }
.codepanel { background: var(--code-bg); color: var(--code-text); border-radius: 12px; padding: 12px 0; font-family: Consolas, "D2Coding", Menlo, monospace; font-size: 15px; line-height: 1.7; overflow-x: auto; }
.ln { display: grid; grid-template-columns: 44px 1fr; white-space: pre; padding-right: 14px; }
.ln .no { text-align: right; padding-right: 12px; color: var(--code-dim); user-select: none; font-size: 12px; line-height: 2.1; }
.ln.auto .tx { color: var(--code-dim); font-style: italic; }
.ln.todo .tx { color: var(--code-dim); }
.ln.done .tx { color: var(--code-ok); }
.ln.help .tx { color: #ffd166; }
.ln.cur { background: #24344a; box-shadow: inset 3px 0 0 var(--code-key); }
.ln.cur .tx { color: #fff; white-space: pre-wrap; word-break: break-all; }
.ln.cur .hint { color: var(--code-key); font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; white-space: normal; }
.dock { position: sticky; bottom: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px 12px 0 0; padding: 12px; margin-top: 12px; box-shadow: 0 -4px 14px rgba(0,0,0,.08); }
.dock .rowin { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
.codein { flex: 1 1 320px; min-width: 0; font-family: Consolas, "D2Coding", Menlo, monospace; font-size: 17px; padding: 10px 12px; border-radius: 8px; border: 2px solid var(--line); background: var(--bg); color: var(--text); }
.codein.err { border-color: var(--ng); }
.msg { margin-top: 8px; font-size: 14px; font-weight: 600; min-height: 1.6em; }
.msg.ng { color: var(--ng); } .msg.ok { color: var(--ok); }
.msg code { background: var(--accent-soft); color: var(--text); padding: 1px 5px; border-radius: 4px; }
.legend2 { font-size: 13px; color: var(--sub); margin: 8px 0 0; }
</style>
</head>
<body data-wc-page>
<main class="wrap">
  <!-- 파일 목록 -->
  <section id="menu" hidden>
    <h1>코드 연습</h1>
    <p class="lead">수업 코드를 한 줄씩 직접 씁니다. 먼저 <b>보고 쓰기</b>로 손에 익히고, 그다음 <b>외워 쓰기</b>로 설명만 보고 써 보세요. 들여쓰기와 띄어쓰기 개수는 달라도 됩니다.</p>
    <div class="grid" id="files"></div>
  </section>

  <!-- 연습 -->
  <section id="play" hidden>
    <div class="head2"><h1 id="fname" class="mono"></h1><span class="badge mid" id="mname"></span><span class="meta">줄 <b id="pi">0</b> / <b id="pn">0</b> · 시간 <b id="tm">00:00</b></span></div>
    <p class="lead" id="mdesc"></p>
    <div class="codepanel" id="panel"></div>
    <p class="legend2">회색 기울임 글씨는 Eclipse가 자동으로 만들어 주는 줄이라 쓰지 않습니다. 파란 줄이 지금 쓸 줄입니다.</p>
    <div class="dock">
      <div class="rowin">
        <input class="codein" id="codein" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="지금 쓸 줄을 입력">
        <button class="btn" type="button" id="okBtn">확인 (Enter)</button>
        <button class="btn ghost" type="button" id="peekBtn" hidden>보기</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>
  </section>

  <!-- 결과 -->
  <section id="done" hidden><div class="card result" id="res"></div></section>
</main>
<script src="../assets/config.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/common.js"></script>
<script>
(function () {
  var u = WC.user(); if (!u) return;
  WC.blockPaste();
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  var MODES = { 1: { name: "보고 쓰기", desc: "파란 줄에 보이는 코드를 그대로 쓰고 Enter를 누르세요." },
                2: { name: "외워 쓰기", desc: "코드는 가려져 있습니다. 파란 줄의 설명을 보고 코드를 쓰세요. 정말 모르겠으면 [보기]를 누르세요. (본 줄은 기록됩니다)" } };
  function fill(s) { return s.replace(/\{sid\}/g, u.sid).replace(/\{name\}/g, u.name); }
  /* 비교: 들여쓰기·띄어쓰기 개수 무시, 기호 주변 공백 무시, ⓒ는 (c)·©도 인정 */
  function norm(s) { return s.replace(/\(c\)|©/gi, "ⓒ").trim().replace(/\s+/g, " ").replace(/\s*([:;{}=<>])\s*/g, "$1"); }
  function indent(n) { return new Array((n || 0) + 1).join("    "); }

  /* ───── 목록 ───── */
  function menu() {
    $("menu").hidden = false; $("play").hidden = true; $("done").hidden = true;
    var box = $("files"), rec = WC.records();
    box.innerHTML = "";
    WC_FILES.forEach(function (f) {
      var n = f.lines.filter(function (l) { return l.t; }).length;
      var card = el("div", "card file");
      card.appendChild(el("h3", null, f.name));
      card.appendChild(el("p", null, f.desc + " · 직접 쓰는 줄 " + n + "개"));
      var sts = el("div", "sts");
      [1, 2].forEach(function (m) {
        var r = rec["code:" + f.id + ":" + m];
        if (r) sts.appendChild(el("span", "badge " + (r.pass ? "ok" : "mid"), MODES[m].name + " " + (r.pass ? "완료" : "도움 받음") + " · " + r.count + "회"));
      });
      card.appendChild(sts);
      var acts = el("div", "acts");
      [1, 2].forEach(function (m) {
        var a = el("a", "btn" + (m === 2 ? " ghost" : ""), MODES[m].name); a.href = "?f=" + f.id + "&m=" + m; acts.appendChild(a);
      });
      if (f.id === "style") { var b = el("a", "btn ghost", "백지 쓰기"); b.href = "../quiz/style-practice/index.html"; acts.appendChild(b); }
      card.appendChild(acts);
      box.appendChild(card);
    });
  }

  /* ───── 연습 ───── */
  var S = null, timer = null;
  function start(f, m) {
    var lines = f.lines.map(function (l) { return { t: l.t ? fill(l.t) : null, auto: l.auto, blank: l.blank, h: l.h ? fill(l.h) : "", in: l.in || 0, st: l.t ? "todo" : "auto" }; });
    S = { f: f, m: m, lines: lines, cur: -1, start: null, tries: 0, firstOk: 0, helped: 0, errs: 0, total: lines.filter(function (l) { return l.t; }).length, doneN: 0 };
    $("menu").hidden = true; $("done").hidden = true; $("play").hidden = false;
    $("fname").textContent = f.name; $("mname").textContent = MODES[m].name; $("mdesc").textContent = MODES[m].desc;
    $("pn").textContent = S.total; $("peekBtn").hidden = m !== 2;
    advance();
    clearInterval(timer); timer = setInterval(function () { if (S) $("tm").textContent = WC.mmss(S.start ? Date.now() - S.start : 0); }, 500);
  }
  function advance() {
    var i = S.cur + 1;
    while (i < S.lines.length && !S.lines[i].t) i++;
    S.cur = i; S.tries = 0; S.peeked = false;
    if (i >= S.lines.length) return finish();
    S.lines[i].st = "cur";
    render();
    var inp = $("codein"); inp.value = ""; inp.classList.remove("err"); inp.focus();
  }
  function render() {
    var p = $("panel"); p.innerHTML = "";
    var curEl = null, no = 0;
    S.lines.forEach(function (l) {
      no++;
      var row = el("div", "ln " + (l.blank ? "auto" : l.st));
      row.appendChild(el("span", "no", String(no)));
      var tx = el("span", "tx");
      if (l.blank) tx.textContent = " ";
      else if (l.auto) tx.textContent = l.auto;
      else if (l.st === "done" || l.st === "help") tx.textContent = indent(l.in) + l.t;
      else if (l.st === "cur") {
        if (S.m === 1 || S.peeked) tx.textContent = indent(l.in) + l.t;
        else { tx.textContent = indent(l.in); tx.appendChild(el("span", "hint", "▶ " + l.h)); }
        curEl = row;
      } else tx.textContent = S.m === 1 ? indent(l.in) + l.t : indent(l.in) + "· · ·";
      row.appendChild(tx);
      p.appendChild(row);
    });
    $("pi").textContent = S.doneN;
    if (curEl) curEl.scrollIntoView({ block: "center" });
  }
  function msg(cls, parts) {
    var m = $("msg"); m.className = "msg " + cls; m.innerHTML = "";
    parts.forEach(function (x) { if (typeof x === "string") m.appendChild(document.createTextNode(x)); else m.appendChild(el("code", null, x.code)); });
  }
  function check() {
    if (!S || S.cur >= S.lines.length) return;
    var inp = $("codein"), v = inp.value, l = S.lines[S.cur];
    if (!v.trim()) { msg("ng", ["코드를 입력하고 Enter를 누르세요."]); return; }
    if (!S.start) S.start = Date.now();
    var a = norm(v), b = norm(l.t);
    if (a === b) {
      if (S.tries === 0 && !S.peeked) S.firstOk++;
      if (S.peeked) { S.helped++; l.st = "help"; } else l.st = "done";
      S.doneN++;
      msg("ok", ["✓ 맞았습니다."]);
      advance();
      return;
    }
    S.tries++; S.errs++;
    inp.classList.add("err");
    var k = 0; while (k < a.length && k < b.length && a.charAt(k) === b.charAt(k)) k++;
    if (k === 0) msg("ng", ["✗ 첫 글자부터 다릅니다. 다시 확인하세요."]);
    else if (k >= b.length) msg("ng", ["✗ 끝에 필요 없는 글자가 더 있습니다."]);
    else if (k >= a.length) msg("ng", ["✗ 여기까지는 맞습니다: ", { code: a }, " — 뒤에 더 써야 합니다."]);
    else msg("ng", ["✗ 여기까지는 맞습니다: ", { code: a.slice(0, k) }, " — 그다음 글자부터 다릅니다."]);
    inp.focus();
  }
  $("okBtn").addEventListener("click", check);
  $("codein").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); check(); } });
  $("codein").addEventListener("input", function () { this.classList.remove("err"); if (S && !S.start && this.value) S.start = Date.now(); });
  $("peekBtn").addEventListener("click", function () {
    if (!S || S.m !== 2 || S.cur >= S.lines.length) return;
    S.peeked = true; render();
    msg("ng", ["코드를 보여 줍니다. 보고 그대로 쓰세요. 이 줄은 「도움 받음」으로 기록됩니다."]);
    $("codein").focus();
  });

  function finish() {
    clearInterval(timer);
    var f = S.f, m = S.m, time = S.start ? Date.now() - S.start : 0;
    var acc = Math.round(S.firstOk / S.total * 100), pass = m === 1 ? true : S.helped === 0;
    var detail = "한 번에 맞힌 줄 " + S.firstOk + "/" + S.total + (m === 2 ? " · 도움 받은 줄 " + S.helped : "") + " · " + WC.mmss(time);
    WC.addRecord("code:" + f.id + ":" + m, { group: "코드 연습", title: f.name + " " + MODES[m].name, score: acc, unit: "%", detail: detail, pass: pass });
    $("play").hidden = true; $("done").hidden = false;
    var res = $("res"); res.innerHTML = "";
    res.appendChild(el("p", "rtitle", "코드 연습 결과 · " + f.name + " " + MODES[m].name));
    res.appendChild(el("p", "who", u.sid + " " + u.name));
    var sc = el("div", "score", String(acc)); sc.appendChild(el("small", null, " %")); res.appendChild(sc);
    res.appendChild(el("p", "rdetail", detail + " · 틀린 횟수 " + S.errs + "번 · " + WC.stamp(Date.now())));
    if (pass) res.appendChild(el("div", "stamp", "✓ " + f.name + " " + MODES[m].name + " 완료"));
    else res.appendChild(el("p", "again", "도움 받은 줄이 " + S.helped + "개 있습니다. [보기] 없이 끝까지 쓸 수 있을 때까지 다시 해 보세요."));
    var row = el("div", "row");
    var again = el("a", "btn ghost", "한 번 더"); again.href = "?f=" + f.id + "&m=" + m; row.appendChild(again);
    if (m === 1) { var nx = el("a", "btn", "외워 쓰기 도전"); nx.href = "?f=" + f.id + "&m=2"; row.appendChild(nx); }
    else {
      var idx = WC_FILES.indexOf(f), nf = WC_FILES[idx + 1];
      if (nf) { var nb = el("a", "btn", "다음 파일: " + nf.name); nb.href = "?f=" + nf.id + "&m=1"; row.appendChild(nb); }
    }
    var mb = el("a", "btn ghost", "파일 목록"); mb.href = "index.html"; row.appendChild(mb);
    res.appendChild(row);
    S = null;
    window.scrollTo(0, 0);
  }

  var q = new URLSearchParams(location.search), f = WC_FILES.filter(function (x) { return x.id === q.get("f"); })[0], m = q.get("m") === "2" ? 2 : 1;
  if (f) start(f, m); else menu();
})();
</script>
</body>
</html>
